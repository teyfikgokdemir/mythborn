name: Mythborn Quality

on:
  pull_request:
  push:
    branches:
      - main
      - codex/full-turkish-membership-platform

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run platform audit
        run: npm run check
