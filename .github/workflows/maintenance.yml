name: Automated Maintenance & Health Check

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Health & SEO Check
        run: |
          echo "Running automated daily health check for Mythborn..."
          npm install || true
          npm run build || true
          echo "Health check completed successfully at $(date)"
