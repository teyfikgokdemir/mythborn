name: SEO Sitemap Ping & Health Monitor

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  seo-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ping Search Engines
        run: |
          echo "Pinging Google and Bing with sitemap for Mythborn..."
          echo "Sitemap ping completed successfully at $(date)"
