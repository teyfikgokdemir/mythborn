name: Mythborn Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mythborn-preview-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run audit
        run: npm run check

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Preview deploy atlandı"
              echo
              echo "GitHub repository secrets içine CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID eklendiğinde bu workflow otomatik preview oluşturur."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply preview D1 migrations
        id: preview_d1
        if: steps.credentials.outputs.configured == 'true'
        continue-on-error: true
        run: npx wrangler d1 migrations apply mythborn-membership-preview --remote --config wrangler.preview.jsonc

      - name: Note unavailable preview D1
        if: steps.credentials.outputs.configured == 'true' && steps.preview_d1.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## Preview deploy atlandı"
            echo
            echo "Cloudflare kimlik bilgileri mevcut, ancak preview D1 kaynağına erişim doğrulanamadı. Kalite ve güvenlik kontrolleri çalışmaya devam etti; preview deploy yapılmadı."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Cloudflare preview
        if: steps.credentials.outputs.configured == 'true' && steps.preview_d1.outcome == 'success'
        shell: bash
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            WORKER_NAME="mythborn-preview-${PR_NUMBER}"
          else
            WORKER_NAME="mythborn-preview-manual"
          fi
          npx wrangler deploy \
            --config wrangler.preview.jsonc \
            --name "$WORKER_NAME"
          {
            echo "## Mythborn preview deploy tamamlandı"
            echo
            echo "Worker adı: `$WORKER_NAME`"
            echo
            echo "Aynı PR'deki yeni commitler bu Worker'ı günceller; yeni Worker oluşturmaz."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Delete closed PR preview Worker
        shell: bash
        run: |
          WORKER_NAME="mythborn-preview-${PR_NUMBER}"
          RESPONSE="$(curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${WORKER_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "Closed PR preview cleaned: $WORKER_NAME" >> "$GITHUB_STEP_SUMMARY"
          elif echo "$RESPONSE" | grep -Eq '"code"[[:space:]]*:[[:space:]]*10090'; then
            echo "Preview already absent: $WORKER_NAME" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Preview cleanup failed: $WORKER_NAME" >&2
            exit 1
          fi
