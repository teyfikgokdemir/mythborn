name: Mythborn Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mythborn-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run audit
        run: npm run check

      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Preview deploy atlandı"
              echo
              echo "GitHub repository secrets içine CLOUDFLARE_API_TOKEN ve CLOUDFLARE_ACCOUNT_ID eklendiğinde bu workflow otomatik preview oluşturur."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy Cloudflare preview
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          SAFE_REF="${PR_NUMBER:-manual}-${GITHUB_SHA::8}"
          WORKER_NAME="mythborn-preview-${SAFE_REF}"
          npx wrangler deploy --name "$WORKER_NAME"
          {
            echo "## Mythborn preview deploy tamamlandı"
            echo
            echo "Worker adı: \`$WORKER_NAME\`"
            echo
            echo "Cloudflare dashboard veya Wrangler çıktısındaki workers.dev adresini açarak test edin."
            echo
            echo "Bu preview D1 binding eklenene kadar yalnızca arayüz ve public rotaları gösterir; üyelik API'leri güvenli biçimde 503 döndürür."
          } >> "$GITHUB_STEP_SUMMARY"
