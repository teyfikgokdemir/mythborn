name: Mythborn Community & Devlog Sync

on:
  schedule:
    - cron: '0 12 * * 3' # Her çarşamba öğle 12:00'de çalışır
  workflow_dispatch:

jobs:
  community-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Devlogs & Community Updates
        run: |
          echo "Syncing Mythborn game devlogs and preparing community updates..."
          echo "Community sync completed successfully at $(date)"
